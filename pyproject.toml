[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-lab"
version = "1.0.0"
description = "MCP tools and LLM gateway services with authorization, streaming redaction, and resilient routing"
requires-python = ">=3.11"
dependencies = [
  "anyio==4.16.0",
  "mcp==1.26.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
  "PyJWT==2.15.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.setuptools.packages.find]
include = ["gateway_assessment*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
